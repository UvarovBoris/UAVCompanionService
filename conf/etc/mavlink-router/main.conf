[General]
TcpServerPort = 5770
ReportStats = false
MavlinkDialect = ardupilotmega

# 1. Вход от ArduPilot SITL (бинарник ArduCopter открывает TCP-порт 5760)
# На реальном дроне этот блок заменяется на [UartEndpoint flightcontroller]
[TcpEndpoint sitl]
Mode = Normal
Address = 127.0.0.1
Port = 5760

# 2. Выход в QGroundControl
[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

# 3. Выход в твой C++ сервис (UAVCompanionService)
[UdpEndpoint companion]
Mode = Normal
Address = 127.0.0.1
Port = 14551
